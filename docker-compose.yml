services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: statusboard
      POSTGRES_PASSWORD: statusboard
      POSTGRES_DB: statusboard
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    # `up -d --wait` blocks on this, so nothing polls for a container by name.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statusboard"]
      interval: 2s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
