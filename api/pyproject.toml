[project]
name = "statusboard-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-filter>=24.3",
    "drf-spectacular>=0.27",
    "django-unfold>=0.40",
    "django-celery-beat>=2.7",
    "django-simple-history>=3.7",
    "django-cors-headers>=4.4",
    "celery[redis]>=5.4",
    "dj-database-url>=2.2",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "requests>=2.32",
    "feedparser>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-xdist>=3.6",
    "pytest-randomly>=3.15",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.7",
    "pre-commit>=4.0",
    "pyyaml>=6.0",
]

[tool.ruff.lint]
extend-select = ["I", "F"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "api.settings"
python_files = ["test_*.py"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=85"
