name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Built once, then every check below runs inside it. What CI proves
      # is what ships, rather than what a runner happened to install.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./api
          load: true
          tags: |
            statusboard-api:ci
            statusboard-api:test
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=0.0.0+g${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # A cached runtime layer pins its apt-get upgrade to the day it
          # was first built, which is how Trivy fails on a CVE apt could
          # already fix.
          no-cache-filters: runtime
          pull: true

      # Runs against a real Postgres. The schema uses check constraints
      # and partial indexes, so a substitute would prove less.
      - name: Tests, with the coverage gate
        run: |
          docker compose -f docker-compose.test.yml run --rm pytest \
            -n auto --cov-fail-under=85 --cov-report=xml:/srv/api/coverage.xml

      - name: Lint and format check
        run: docker compose -f docker-compose.test.yml run --rm ruff

      - name: Every documented field maps to the model
        run: docker compose -f docker-compose.test.yml run --rm docs

      # Stdlib only, so it runs on the runner rather than paying for a
      # container. Holds comments and docstrings to AGENTS.md.
      - name: Prose
        run: python3 bin/check_prose.py

      # Stdlib only as well. These cover the scripts in bin/, which have
      # no dependency manager and no Django to test them with.
      - name: The bin/ scripts
        run: python3 -m unittest discover -s bin/tests

      - name: No migration is missing
        run: |
          docker compose -f docker-compose.test.yml run --rm --entrypoint sh pytest \
            -c 'python manage.py makemigrations --check --dry-run'

      - name: Build the client image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          load: true
          tags: statusboard-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Same reason as the API's: a cached runtime layer pins its
          # apk upgrade to the day it was first built.
          no-cache-filters: runtime
          pull: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Client dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Client lint, types and tests
        run: pnpm lint:ci && pnpm typecheck && pnpm test
        working-directory: app

      - name: The generated client matches the contract
        run: pnpm codegen && git diff --exit-code src/api
        working-directory: app

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: api/coverage.xml
          if-no-files-found: warn

      - name: Stop the stores
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

      - name: Trivy scan, the API
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: statusboard-api:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      # Its own step rather than a second image-ref. The action takes
      # one, and an unscanned image is the half nobody is watching.
      - name: Trivy scan, the client
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: statusboard-app:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  edge:
    name: Publish the edge images
    # `needs` is what stops a red main becoming a deployable image.
    needs: [build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push edge
        run: |
          for part in api app; do
            docker buildx build --push "./$part" \
              -t "ghcr.io/${{ github.repository_owner }}/statusboard-$part:edge" \
              -t "ghcr.io/${{ github.repository_owner }}/statusboard-$part:sha-${{ github.sha }}"
          done
