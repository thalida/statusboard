repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        # The design spec is an approved document with 436 long lines. It
        # has never passed this hook. Reflowing it to land a URL change
        # would be a 1300-line diff on prose nobody asked to rewrite.
        exclude: ^docs/specs/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must match the ruff in api/uv.lock. On different versions the hook
    # and `just lint` format differently and undo each other, so a commit
    # fails with "files were modified by this hook" and nothing explains
    # why.
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
